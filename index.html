<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a1938">
  <meta name="description" content="Un regalito de cumpleaños y un recuerdo de los dos.">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:title" content="Feliz cumpleaños amiguita">
  <meta property="og:description" content="¡Feliz cumpleaños, amiguita! ❤️">
  <meta property="og:type" content="website">
  <title>Feliz cumpleaños amiguita</title>
  <link rel="icon" type="image/png" href="./assets/corazon.png">
  <link rel="stylesheet" href="./estilos.css?v=6">
  <script src="./sonido.js?v=3" defer></script>
  <script src="./celebrar.js?v=6" defer></script>
</head>
<body>
  <div class="controles">
    <button class="control" id="repetir" type="button" aria-label="Repetir fuegos artificiales" title="Repetir fuegos artificiales" hidden>
      <img src="./assets/chispa.png" alt="" width="18" height="18">
    </button>
    <button class="control" id="cerrar" type="button" aria-label="Cerrar la carta" aria-controls="carta" title="Cerrar la carta" hidden>
      <span aria-hidden="true">×</span>
    </button>
    <button class="control" id="sonido" type="button" aria-label="Sonido" aria-pressed="true" title="Silenciar" hidden>
      <span class="altavoz" aria-hidden="true"><i></i></span>
    </button>
  </div>
  <main>
    <section class="portada" id="inicio" aria-labelledby="saludo">
      <div class="cielo" aria-hidden="true"></div>
      <div class="paisaje" aria-hidden="true"></div>
      <canvas id="fuegos" aria-hidden="true"></canvas>
      <div class="cumple-edad" role="img" aria-label="Pastel con velitas encendidas para celebrar tus 19 años">
        <span class="pastel" aria-hidden="true">
          <img src="./assets/pastel.png" alt="" width="32" height="28">
          <i class="llama"></i><i class="llama"></i><i class="llama"></i>
        </span>
        <span aria-hidden="true">19</span>
      </div>
      <div class="portada-contenido">
        <div class="portada-texto">
          <div class="vidas" aria-hidden="true">
            <img src="./assets/corazon.png" alt=""><img src="./assets/corazon.png" alt=""><img src="./assets/corazon.png" alt="">
          </div>
          <h1 id="saludo" aria-label="¡Feliz cumpleaños, amiguita!">
            <span class="cumple" aria-hidden="true"><span class="palabra">¡Feliz</span> <span class="palabra">cumpleaños,</span></span>
            <span class="dedicatoria" aria-hidden="true"><span class="palabra">amiguita!</span></span>
          </h1>
        </div>
        <a class="abrir boton-pixel" href="#carta" id="abrir">Abrir</a>
        <a class="diorama" id="regalo" href="#carta" aria-label="Abrir los regalos">
          <span class="aura"></span>
          <span class="isla">
            <img class="isla-base" src="./assets/isla.png?v=2" width="240" height="202" alt="">
            <img class="isla-tapa" src="./assets/lazo.png" width="240" height="202" alt="">
            <img class="tapa-chica" src="./assets/lazo-lila.png" width="240" height="202" alt="">
          </span>
          <span class="destello d1" aria-hidden="true"></span><span class="destello d2" aria-hidden="true"></span>
          <span class="destello d3" aria-hidden="true"></span><span class="destello d4" aria-hidden="true"></span>
          <img class="corazon-vuelta" id="corazon-vuelta" src="./assets/corazon.png" alt="" width="9" height="8" hidden>
        </a>
      </div>
    </section>

    <section class="recuerdo" id="carta" aria-labelledby="titulo-carta">
      <div class="recuerdo-interior">
        <h2 class="solo-lectores" id="titulo-carta" tabindex="-1">Un recuerdo de los dos</h2>
        <figure class="foto" id="postal">
          <span class="cinta" aria-hidden="true"></span>
          <div class="imagen-recuerdo">
            <img class="captura" src="./assets/nosotros.jpg" alt="Nuestros dos personajes de Minecraft, uno junto al otro en un camino de piedra." width="1280" height="720">
            <span class="brillos-foto" aria-hidden="true">
              <i class="destello"></i><i class="destello"></i><i class="destello"></i>
              <i class="destello"></i><i class="destello"></i><i class="destello"></i>
            </span>
            <span class="corazones-final" aria-hidden="true">
              <img src="./assets/corazon.png" alt=""><img src="./assets/corazon.png" alt=""><img src="./assets/corazon.png" alt="">
            </span>
          </div>
          <figcaption>
            <ol class="frases" id="frases">
              <li><strong>Muchas gracias por ser mi amiga. ❤️🥹</strong> Espero que hoy te la pases muy bien y que te diviertas muchísimo.</li>
              <li>Amiguita, hoy también se cumplen cuatro meses de que nos conocimos. ✨</li>
              <li>Gracias por todos los momentos bonitos que hemos pasado juntos. Eres mi mejor amiga. ❤️</li>
              <li><p>Conocerte fue una sorpresa muy bonita.</p> <p>Me hace muy feliz que estés en mi vida. 😊</p></li>
              <li>Eres una gran persona, amiguita. 🫶 Siempre voy a estar muy agradecido por haberte conocido.</li>
              <li>Eres muy importante para mí, amiguita. Y siempre te voy a llevar en mi corazón. ❤️</li>
              <li>Aunque no te pueda dar uno en persona, te mando un abracito muy, muy fuerte, amiguita. 🫂</li>
              <li><p>Te quiero mucho, amiguita bonita. ❤️</p> <p class="felicitacion">¡Muchas felicidades!</p></li>
            </ol>
            <div class="pasadores" id="pasadores" role="group" aria-label="Recorrer las frases" hidden>
              <button class="pasador" id="anterior" type="button" aria-label="Frase anterior" title="Frase anterior" aria-controls="frases">
                <span class="punta atras" aria-hidden="true"></span>
              </button>
              <span class="cuenta" id="cuenta"></span>
              <button class="pasador" id="siguiente" type="button" aria-label="Frase siguiente" title="Frase siguiente" aria-controls="frases">
                <span class="punta" aria-hidden="true"></span><span class="texto-cerrar">Cerrar</span>
              </button>
            </div>
            <span class="solo-lectores" id="anuncio-frase" role="status" aria-atomic="true"></span>
          </figcaption>
        </figure>
        <div class="pie"><a href="#inicio" id="volver">Volver</a></div>
      </div>
    </section>
  </main>
</body>
</html>
